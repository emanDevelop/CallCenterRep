<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>سحابة الياسمين · المساعد الصوتي</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme and language before first paint to avoid a flash.
      (function () {
        var d = document.documentElement;
        var theme, lang;
        try {
          theme = localStorage.getItem("yd-theme");
          lang = localStorage.getItem("yd-lang");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        if (lang !== "en") lang = "ar";
        d.dataset.theme = theme;
        d.lang = lang;
        d.dir = lang === "ar" ? "rtl" : "ltr";
      })();
    </script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>

    <header class="topbar">
      <a class="logo" href="./" aria-label="Yasmeen Digital">
        <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="var(--accent)" />
              <stop offset="1" stop-color="var(--accent-2)" />
            </linearGradient>
          </defs>
          <g fill="url(#lg)" transform="translate(16 16)">
            <ellipse rx="4.6" ry="8" cy="-7" />
            <ellipse rx="4.6" ry="8" cy="-7" transform="rotate(72)" />
            <ellipse rx="4.6" ry="8" cy="-7" transform="rotate(144)" />
            <ellipse rx="4.6" ry="8" cy="-7" transform="rotate(216)" />
            <ellipse rx="4.6" ry="8" cy="-7" transform="rotate(288)" />
          </g>
          <circle cx="16" cy="16" r="3.4" fill="var(--bg)" />
        </svg>
      </a>
      <div class="topbar-actions">
        <button id="langBtn" class="chip" type="button" data-i18n-aria="switchLang">EN</button>
        <button id="themeBtn" class="icon-btn" type="button" data-i18n-aria="switchTheme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" />
          </svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="hero">
        <h1 class="company" data-i18n="company">سحابة الياسمين</h1>
        <p class="product" data-i18n="product">المساعد الصوتي الذكي</p>
        <p class="subtitle" data-i18n="subtitle">اسألنا عن خدماتنا وأسعارنا وساعات الدوام، بصوتك.</p>
      </section>

      <section class="stage" aria-live="polite">
        <div class="orb-wrap">
          <canvas id="orb" class="orb" aria-hidden="true"></canvas>
        </div>
        <p id="status" class="status" data-mode="idle"></p>

        <div class="controls">
          <button id="muteBtn" class="ctrl" type="button" disabled data-i18n-aria="mute">
            <svg class="i-mic" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" />
            </svg>
            <svg class="i-mic-off" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 9.4V6a3 3 0 0 0-5.9-.8M9 9v2a3 3 0 0 0 4.6 2.5M5.5 11a6.5 6.5 0 0 0 10.4 5.2M18.4 12.6c.07-.5.1-1 .1-1.6M12 17.5V21M3.5 3.5l17 17" />
            </svg>
          </button>

          <button id="callBtn" class="call" type="button" data-state="idle">
            <svg class="i-phone" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.6 3.8 8.9 3a1.6 1.6 0 0 1 2 .9l1 2.6a1.6 1.6 0 0 1-.4 1.8L10 9.6a11 11 0 0 0 4.4 4.4l1.3-1.5a1.6 1.6 0 0 1 1.8-.4l2.6 1a1.6 1.6 0 0 1 .9 2l-.8 2.3a2.4 2.4 0 0 1-2.6 1.6A15.6 15.6 0 0 1 5 6.4a2.4 2.4 0 0 1 1.6-2.6Z" />
            </svg>
            <span id="callLabel"></span>
          </button>

          <div class="settings">
            <button id="settingsBtn" class="ctrl" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="settingsMenu" data-i18n-aria="settings">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h10M18 7h2M4 17h4M12 17h8" />
                <circle cx="16" cy="7" r="2.2" />
                <circle cx="10" cy="17" r="2.2" />
              </svg>
            </button>
            <div id="settingsMenu" class="menu" role="dialog" hidden>
              <label class="menu-label" for="micSelect" data-i18n="microphone">الميكروفون</label>
              <select id="micSelect" class="select"></select>
              <p class="menu-hint" data-i18n="micHint">اختر الميكروفون اللي بدك تحكي فيه.</p>
              <label class="switch-row" for="speakerMode">
                <span class="switch-text">
                  <span class="menu-label" data-i18n="speakerMode">وضع السماعة</span>
                  <span class="menu-hint" data-i18n="speakerHint">صوت أعلى على الموبايل. الميكروفون بيسكت لما المساعد يحكي.</span>
                </span>
                <input id="speakerMode" class="switch-input" type="checkbox" role="switch" />
                <span class="switch" aria-hidden="true"></span>
              </label>
            </div>
          </div>
        </div>

        <div id="toast" class="toast" role="alert" hidden></div>
      </section>

      <section class="transcript-card" aria-labelledby="transcriptTitle">
        <div class="transcript-head">
          <h2 id="transcriptTitle" data-i18n="transcript">المحادثة</h2>
          <span id="liveDot" class="live" hidden data-i18n="live">مباشر</span>
        </div>
        <ol id="transcript" class="transcript"></ol>
        <p id="emptyHint" class="empty" data-i18n="empty">اضغط على زر الاتصال وابدأ الحديث. رح تظهر المحادثة هون.</p>
        <form id="composer" class="composer" autocomplete="off">
          <input id="textInput" class="text-input" type="text" dir="auto" disabled data-i18n-placeholder="typePlaceholder" />
          <button id="sendBtn" class="send" type="submit" disabled data-i18n-aria="send">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" /></svg>
          </button>
        </form>
      </section>
    </main>

    <footer class="foot" data-i18n="footer">شركة وهمية لأغراض تعليمية · مبني على Pipecat</footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
